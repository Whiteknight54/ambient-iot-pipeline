<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
  <marker id="d" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#2f5d8a"/>
  </marker>
</defs>

<text x="590" y="32" font-size="16" font-weight="bold" text-anchor="middle">Dimensional model underpinning the Tableau dashboard</text>

<!-- Dim_Tag -->
<rect x="40" y="70" width="250" height="150" rx="5" fill="#eef2f7" stroke="#2f5d8a"/>
<rect x="40" y="70" width="250" height="30" rx="5" fill="#2f5d8a"/>
<text x="165" y="90" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Dim_Tag</text>
<text x="55" y="120" font-size="11.5" font-weight="bold">PK  tag_id</text>
<text x="55" y="140" font-size="11.5" font-weight="bold">FK  zone_id</text>
<text x="55" y="160" font-size="11.5">asset_type</text>
<text x="55" y="180" font-size="11.5">harvest_threshold</text>
<line x1="50" y1="192" x2="280" y2="192" stroke="#c6d2e0"/>
<text x="55" y="209" font-size="10.5" fill="#666">10 rows — one per simulated tag</text>

<!-- Dim_Zone -->
<rect x="40" y="400" width="250" height="185" rx="5" fill="#eef2f7" stroke="#2f5d8a"/>
<rect x="40" y="400" width="250" height="30" rx="5" fill="#2f5d8a"/>
<text x="165" y="420" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Dim_Zone</text>
<text x="55" y="450" font-size="11.5" font-weight="bold">PK  zone_id</text>
<text x="55" y="470" font-size="11.5">location</text>
<text x="55" y="490" font-size="11.5">optimal_temp_range</text>
<text x="55" y="510" font-size="11.5">base_temp_c</text>
<text x="55" y="530" font-size="11.5">rssi_base_dbm</text>
<text x="55" y="550" font-size="11.5">asset_type</text>
<line x1="50" y1="561" x2="280" y2="561" stroke="#c6d2e0"/>
<text x="55" y="577" font-size="10.5" fill="#666">2 rows — greenhouse-A, greenhouse-B</text>

<!-- Fact_Telemetry -->
<rect x="400" y="150" width="300" height="360" rx="5" fill="#eef5ee" stroke="#2d6a2d" stroke-width="1.5"/>
<rect x="400" y="150" width="300" height="30" rx="5" fill="#2d6a2d"/>
<text x="550" y="170" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Fact_Telemetry</text>
<text x="415" y="200" font-size="11.5" font-weight="bold">PK  reading_id</text>
<text x="415" y="220" font-size="11.5" font-weight="bold">FK  tag_id</text>
<text x="415" y="240" font-size="11.5" font-weight="bold">FK  zone</text>
<text x="415" y="262" font-size="11.5">timestamp</text>
<text x="415" y="281" font-size="11.5">hour</text>
<text x="415" y="300" font-size="11.5">day_of_week</text>
<line x1="410" y1="312" x2="690" y2="312" stroke="#bcd3bc"/>
<text x="415" y="330" font-size="11" font-weight="bold" fill="#555">MEASURES (long format)</text>
<text x="425" y="350" font-size="11.5">metric</text>
<text x="425" y="369" font-size="11.5">value</text>
<text x="425" y="388" font-size="11.5">classification</text>
<text x="425" y="407" font-size="11.5">alert</text>
<text x="425" y="426" font-size="11.5">pipeline_latency_ms</text>
<text x="425" y="445" font-size="11.5">battery_co2_saved_g <tspan font-size="9.5" fill="#b03030">(cumulative)</tspan></text>
<line x1="410" y1="458" x2="690" y2="458" stroke="#bcd3bc"/>
<text x="415" y="476" font-size="10.5" fill="#666">8,076 rows — one per admitted reading,</text>
<text x="415" y="492" font-size="10.5" fill="#666">7 days at 5-minute cadence</text>

<!-- Fact_Gateway_Metrics -->
<rect x="810" y="150" width="330" height="360" rx="5" fill="#eef5ee" stroke="#2d6a2d" stroke-width="1.5"/>
<rect x="810" y="150" width="330" height="30" rx="5" fill="#2d6a2d"/>
<text x="975" y="170" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Fact_Gateway_Metrics</text>
<text x="825" y="200" font-size="11.5" font-weight="bold">PK  run_id</text>
<text x="825" y="220" font-size="11.5">run_at</text>
<line x1="820" y1="232" x2="1130" y2="232" stroke="#bcd3bc"/>
<text x="825" y="250" font-size="11" font-weight="bold" fill="#555">RUN CONFIGURATION</text>
<text x="835" y="269" font-size="11.5">zone_count · tags_per_zone · poll_cycles</text>
<line x1="820" y1="281" x2="1130" y2="281" stroke="#bcd3bc"/>
<text x="825" y="299" font-size="11" font-weight="bold" fill="#555">ADMISSION MEASURES</text>
<text x="835" y="318" font-size="11.5">total_seen · accepted</text>
<text x="835" y="337" font-size="11.5" fill="#b03030">rejected_unknown_tag</text>
<text x="835" y="356" font-size="11.5" fill="#b03030">rejected_bad_auth</text>
<text x="835" y="375" font-size="11.5">rejected_malformed</text>
<text x="835" y="394" font-size="11.5" fill="#b03030">rogues_injected · spoofed_injected</text>
<line x1="820" y1="406" x2="1130" y2="406" stroke="#bcd3bc"/>
<text x="825" y="424" font-size="11" font-weight="bold" fill="#555">THROUGHPUT MEASURES</text>
<text x="835" y="443" font-size="11.5">total_published · throughput_msgs_per_s</text>
<text x="835" y="462" font-size="11.5">avg / min / max_latency_ms · run_duration_s</text>
<line x1="820" y1="474" x2="1130" y2="474" stroke="#bcd3bc"/>
<text x="825" y="492" font-size="10.5" fill="#666">1 row per pipeline run — no zone key</text>

<!-- joins -->
<line x1="290" y1="145" x2="396" y2="218" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#d)"/>
<text x="300" y="170" font-size="10.5" fill="#2f5d8a">1 → many</text>
<line x1="290" y1="470" x2="396" y2="243" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#d)"/>
<text x="300" y="380" font-size="10.5" fill="#2f5d8a">1 → many</text>

<!-- no-join note -->
<line x1="705" y1="330" x2="805" y2="330" stroke="#999" stroke-width="1.4" stroke-dasharray="4,4"/>
<text x="755" y="322" font-size="10.5" fill="#777" text-anchor="middle">no join</text>

<rect x="40" y="612" width="1100" height="66" rx="4" fill="#f7f8fa" stroke="#ccc"/>
<text x="55" y="633" font-size="11.5" font-weight="bold">Design note</text>
<text x="55" y="651" font-size="11">The two fact tables sit at different grains and are not joined. Fact_Telemetry records one row per admitted reading and is dimensioned by tag and zone;</text>
<text x="55" y="668" font-size="11">Fact_Gateway_Metrics records one row per pipeline run, carrying admission and throughput measures for the run as a whole.</text>
</svg>
